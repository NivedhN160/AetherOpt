[project]
name = "aetheropt"
version = "0.1.0"
description = "Production-grade Quantum-Inspired Optimization Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "highspy>=1.5.3",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.scripts]
aetheropt = "aetheropt.main:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 88
target-version = "py310"
